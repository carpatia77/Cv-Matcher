name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Security audit with pip-audit
      run: |
        pip install pip-audit
        # As versoes corrigidas de python-multipart, pymupdf, starlette, click,
        # pillow e python-dotenv exigem Python >=3.10. A VM de producao roda
        # Python 3.9 (ver docs/PLANO_ALINHAMENTO_PYTHON_CI.md) — testado um a um
        # com `pip download --python-version 3.9`, nenhum pacote tem versao
        # nao-vulneravel instalavel neste ambiente hoje. Risco aceito e
        # documentado ate a VM ser atualizada (Passo 4 do plano acima).
        pip-audit -r requirements.txt \
          --ignore-vuln PYSEC-2026-1852 \
          --ignore-vuln PYSEC-2026-3038 \
          --ignore-vuln PYSEC-2026-3037 \
          --ignore-vuln PYSEC-2026-3036 \
          --ignore-vuln PYSEC-2026-3040 \
          --ignore-vuln PYSEC-2026-3039 \
          --ignore-vuln PYSEC-2026-3001 \
          --ignore-vuln PYSEC-2026-161 \
          --ignore-vuln PYSEC-2026-249 \
          --ignore-vuln PYSEC-2026-248 \
          --ignore-vuln PYSEC-2026-2281 \
          --ignore-vuln PYSEC-2026-2280 \
          --ignore-vuln PYSEC-2026-2132 \
          --ignore-vuln PYSEC-2026-165 \
          --ignore-vuln PYSEC-2026-2250 \
          --ignore-vuln PYSEC-2026-2253 \
          --ignore-vuln PYSEC-2026-2251 \
          --ignore-vuln PYSEC-2026-2255 \
          --ignore-vuln PYSEC-2026-2257 \
          --ignore-vuln PYSEC-2026-2256 \
          --ignore-vuln PYSEC-2026-2254 \
          --ignore-vuln PYSEC-2026-2252 \
          --ignore-vuln PYSEC-2026-2249 \
          --ignore-vuln PYSEC-2026-2874 \
          --ignore-vuln PYSEC-2026-3453 \
          --ignore-vuln PYSEC-2026-3451 \
          --ignore-vuln PYSEC-2026-3454 \
          --ignore-vuln PYSEC-2026-3495 \
          --ignore-vuln PYSEC-2026-3496 \
          --ignore-vuln PYSEC-2026-3494 \
          --ignore-vuln PYSEC-2026-3493 \
          --ignore-vuln PYSEC-2026-2270

    - name: Test with pytest
      run: |
        pytest -v

