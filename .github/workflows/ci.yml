name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Security audit with pip-audit
      run: |
        pip install pip-audit
        # python-multipart: as versoes corrigidas (>=0.0.22) exigem Python >=3.10.
        # A VM de producao roda Python 3.9 (ver docs/PLANO_ALINHAMENTO_PYTHON_CI.md),
        # entao nao ha versao nao-vulneravel instalavel neste ambiente hoje. Risco
        # aceito e documentado ate a VM ser atualizada (Passo 4 do plano acima).
        pip-audit -r requirements.txt \
          --ignore-vuln PYSEC-2026-1852 \
          --ignore-vuln PYSEC-2026-3038 \
          --ignore-vuln PYSEC-2026-3037 \
          --ignore-vuln PYSEC-2026-3036 \
          --ignore-vuln PYSEC-2026-3040 \
          --ignore-vuln PYSEC-2026-3039

    - name: Test with pytest
      run: |
        pytest -v

