
cv-matcher.duckdns.org {
    reverse_proxy 127.0.0.1:8055 {
        header_up Host {host}
        header_up X-Real-IP {remote}
        header_down X-Accel-Buffering "no"
        header_down -X-Frame-Options
        header_down Content-Security-Policy "frame-ancestors *;"
        flush_interval -1
    }
}

