[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Enable the rule sets the CI was checking
# FA: flake8-future-annotations — flags PEP 604 syntax (X | Y) incompatible with target-version
select = ["E", "F", "I", "B", "BLE", "RUF", "ASYNC", "FA"]

ignore = [
    # FastAPI dependency-injection pattern: File(...) / Form(...) in default args
    "B008",
    # LLM fallback chains require broad exception handling to be resilient
    # across heterogeneous API error types from NVIDIA NIM
    "BLE001",
    # File is written synchronously then handed off to BackgroundTasks thread —
    # acceptable in this context
    "ASYNC230",
    # os.path.exists is used for simple file-existence checks before FileResponse;
    # adding trio/anyio paths would over-engineer this FastAPI+uvicorn stack
    "ASYNC240",
    # Long lines in LLM prompt strings are intentional and must not be wrapped
    "E501",
    # PEP 484 optional — will be fixed in a dedicated type annotation pass
    "RUF013",
    # FA100 nudges toward `from __future__ import annotations`, which changes how FastAPI
    # resolves type hints at runtime — kept as Optional[X] intentionally. FA102 (the real
    # protection against py3.10+ syntax like `X | Y`) stays active.
    "FA100",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
